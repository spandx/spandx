[package]
name = "spandx"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Can Eldem <eldemcan@gmail.com>", "mo khan <mo@mokhan.ca>"]
description = "A Rust interface to the SPDX catalogue for dependency license scanning"
homepage = "https://spandx.github.io/"
repository = "https://github.com/spandx/spandx-rs"
license = "MIT"
keywords = ["spdx", "license", "dependencies", "security", "scanner"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI framework
clap = { version = "4.0", features = ["derive", "env"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# XML parsing
roxmltree = "0.19"
quick-xml = { version = "0.31", features = ["serialize"] }

# Git operations
git2 = "0.18"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime and utilities
futures = "0.3"
async-trait = "0.1"

# Parallel processing
rayon = "1.8"

# Path handling
camino = { version = "1.1", features = ["serde1"] }

# Progress indicators
indicatif = "0.17"

# Table formatting
tabled = "0.14"

# CSV handling
csv = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# URL handling
url = { version = "2.4", features = ["serde"] }

# Regular expressions
regex = "1.10"

# String similarity
strsim = "0.10"

# Configuration
config = "0.13"

# File watching and utilities
walkdir = "2.4"
tempfile = "3.8"

# Compression
flate2 = "1.0"

# Cache storage
sled = "0.34"

# HCL parsing for Terraform
hcl-rs = "0.16"

# License expression parsing
pest = "2.7"
pest_derive = "2.7"

# Binary data handling
byteorder = "1.5"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.6", features = ["v4"] }

# URL encoding
urlencoding = "2.1"

# Hashing
sha1 = "0.10"

# Directory utilities
dirs = "5.0"

# Static values
lazy_static = "1.4"

[dev-dependencies]
# Testing
tokio-test = "0.4"
wiremock = "0.5"
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
# Build-time dependencies if needed

[[bin]]
name = "spandx"
path = "src/main.rs"

[[example]]
name = "hierarchical_cache_demo"
path = "examples/hierarchical_cache_demo.rs"

[[example]]
name = "error_handling_demo"
path = "examples/error_handling_demo.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bench]]
name = "performance_benchmarks"
harness = false
